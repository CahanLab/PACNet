name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["webApp/**", "data/**", "tools/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::shinythemes
            any::shinycssloaders
            any::shinyWidgets
            any::shinyjs
            any::shinyalert
            any::shinybusy
            any::ggplot2
            any::gridExtra
            any::RColorBrewer
            any::pheatmap
            any::plotly
            any::dplyr
            any::randomForest
      - run: tools/build_site.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
